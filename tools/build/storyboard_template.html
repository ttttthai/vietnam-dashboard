<title>Vietnam Dashboard Storyboard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: a script sheet — one column of numbered scenes per film, timecode down the left, "on screen" box on the right */
:root {
  --paper: #faf8f3; --card: #ffffff; --ink: #16181d; --ink2: #3d4250; --ink3: #7a7f8a; --rule: #e6e3db; --accent: #e34948; --accent-ink: #b42318; --chip: #f2efe7; --hi: #fff4d6;
  --f-head: 'Newsreader', Georgia, 'Times New Roman', serif; --f-ui: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif; --f-mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --paper: #15171b; --card: #1d2026; --ink: #ece9e2; --ink2: #c4c1ba; --ink3: #8d9099; --rule: #2e323a; --accent: #ff6b66; --accent-ink: #ff8a85; --chip: #262a31; --hi: #3a3220; color-scheme: dark } }
:root[data-theme="dark"] { --paper: #15171b; --card: #1d2026; --ink: #ece9e2; --ink2: #c4c1ba; --ink3: #8d9099; --rule: #2e323a; --accent: #ff6b66; --accent-ink: #ff8a85; --chip: #262a31; --hi: #3a3220; color-scheme: dark }
body { background: var(--paper); color: var(--ink); font: 400 15px/1.55 var(--f-ui); }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px 56px; }
.kick { font: 700 11.5px var(--f-ui); letter-spacing: 1.4px; text-transform: uppercase; color: var(--accent-ink); }
h1 { font: 700 clamp(30px, 5vw, 46px)/1.05 var(--f-head); margin: 6px 0 8px; text-wrap: balance; }
.lede { color: var(--ink2); max-width: 66ch; margin: 0 0 18px; }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); padding: 10px 0; border-bottom: 1px solid var(--rule); display: grid; gap: 10px; }
.films { display: flex; gap: 6px; flex-wrap: wrap; }
.films button, .seg button { font: 600 13px var(--f-ui); border: 1px solid var(--rule); background: var(--card); color: var(--ink); border-radius: 18px; padding: 6px 13px; cursor: pointer; display: inline-flex; gap: 6px; align-items: baseline; }
.films button small { font: 500 11px var(--f-mono); color: var(--ink3); }
.films button[aria-pressed="true"], .seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.films button[aria-pressed="true"] small { color: var(--paper); opacity: .75; }
.tools { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.seg { display: inline-flex; gap: 4px; }
input[type=search] { font: 400 14px var(--f-ui); padding: 7px 12px; border-radius: 18px; border: 1px solid var(--rule); background: var(--card); color: var(--ink); min-width: 0; flex: 1 1 220px; max-width: 360px; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.film-h { margin: 22px 0 6px; display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: baseline; }
.film-h h2 { font: 700 26px/1.15 var(--f-head); margin: 0; }
.film-h span { font: 500 13px var(--f-mono); color: var(--ink3); }
ol.sc { list-style: none; margin: 0; padding: 0; }
.scene { display: grid; grid-template-columns: 72px minmax(0, 1fr) minmax(0, 300px); gap: 14px; padding: 16px 0; border-top: 1px solid var(--rule); }
.tc { font: 500 12px var(--f-mono); color: var(--ink3); } .tc b { display: block; font: 700 20px var(--f-head); color: var(--ink); }
.k { font: 700 11px var(--f-ui); letter-spacing: 1px; text-transform: uppercase; color: var(--accent-ink); }
.txt { margin: 4px 0 8px; font: 400 16px/1.55 var(--f-ui); max-width: 66ch; }
.txt mark { background: var(--hi); color: inherit; padding: 0 2px; border-radius: 2px; }
.figs { display: flex; flex-wrap: wrap; gap: 6px; }
.fig { background: var(--chip); border-radius: 8px; padding: 4px 9px; display: grid; } .fig b { font: 700 15px var(--f-head); font-variant-numeric: tabular-nums; } .fig span { font: 400 11px var(--f-ui); color: var(--ink3); }
.on { background: var(--card); border: 1px solid var(--rule); border-radius: 10px; padding: 9px 11px; font-size: 12.5px; align-self: start; display: grid; gap: 3px; min-width: 0; }
.on .t { font: 600 12px var(--f-ui); } .on .h { color: var(--ink2); } .on .c { color: var(--ink3); }
.flags { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 4px; } .flags i { font: 600 10.5px var(--f-ui); font-style: normal; border: 1px solid var(--rule); border-radius: 9px; padding: 0 7px; color: var(--ink2); }
.src { font: 400 11.5px var(--f-ui); color: var(--ink3); margin-top: 6px; } .src summary { cursor: pointer; }
.empty { color: var(--ink3); padding: 20px 0; }
.foot { color: var(--ink3); font-size: 12.5px; margin-top: 28px; border-top: 1px solid var(--rule); padding-top: 12px; }
@media (max-width: 760px) { .scene { grid-template-columns: 52px minmax(0, 1fr); } .on { grid-column: 2; } .tc b { font-size: 17px; } }
</style>
<div class="wrap">
  <div class="kick">Vietnam Dashboard · <span id="asof"></span></div>
  <h1 id="h1">Kịch bản các bộ phim</h1>
  <p class="lede" id="lede"></p>
  <div class="bar">
    <div class="films" id="films" role="group" aria-label="Films"></div>
    <div class="tools">
      <div class="seg" role="group" aria-label="Language"><button type="button" data-lang="vi">Tiếng Việt</button><button type="button" data-lang="en">English</button></div>
      <input type="search" id="q" placeholder="Tìm trong lời kể…" aria-label="Search the narration">
    </div>
  </div>
  <div id="film"></div>
  <p class="foot" id="foot"></p>
</div>
<script>
const D = /*DATA*/null;
let lang = 'vi', cur = D.films[0].id, q = '';
try { lang = localStorage.getItem('sb-lang') || 'vi'; cur = localStorage.getItem('sb-film') || cur; } catch (e) {}
if (!D.films.some(f => f.id === cur)) cur = D.films[0].id;
const T = (vi, en) => lang === 'en' ? en : vi, esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
// estimated running time per scene (same rule as the dashboard's film player: reading time, a beat, chart replays)
const est = s => (900 + Math.max(3200, Math.min(14000, (s[lang] || s.vi).length * 62), (s[lang] || s.vi).length / 14 * 1000 / .95) + (s.play ? 5000 : 0)) / 1000;
const mmss = t => `${Math.floor(t / 60)}:${String(Math.round(t % 60)).padStart(2, '0')}`;
function render() {
  document.documentElement.lang = lang;
  document.getElementById('asof').textContent = T('kịch bản ngày ', 'script as of ') + D.as_of;
  document.getElementById('h1').textContent = T('Kịch bản các bộ phim', 'The film scripts');
  document.getElementById('lede').textContent = T('Mọi cảnh trong các bộ phim có thuyết minh của dashboard, theo thứ tự: lời kể, các con số hiện trên màn hình và nội dung đang chiếu. Chỉ để xem; muốn sửa, hãy nói với Claude.', 'Every scene of the dashboard\'s narrated films, in order: what the narrator says, the figures shown on screen and what is on screen at the time. Read-only; to change a scene, ask Claude.');
  document.getElementById('q').placeholder = T('Tìm trong lời kể…', 'Search the narration…');
  document.querySelectorAll('[data-lang]').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === lang));
  document.getElementById('films').innerHTML = D.films.map(f => { const t = f.scenes.reduce((a, s) => a + est(s), 0); return `<button type="button" data-film="${f.id}" aria-pressed="${f.id === cur}">${esc(T(...f.name))} <small>${f.scenes.length} · ${mmss(t)}</small></button>`; }).join('');
  const f = D.films.find(x => x.id === cur), ql = q.trim().toLowerCase(); let t0 = 0;
  const rows = f.scenes.map((s, i) => { const start = t0; t0 += est(s); const txt = s[lang] || s.vi;
    if (ql && !(txt.toLowerCase().includes(ql) || JSON.stringify(s.figs).toLowerCase().includes(ql))) return '';
    const hi = ql ? esc(txt).replace(new RegExp(ql.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'), m => `<mark>${m}</mark>`) : esc(txt);
    const on = s.on[lang] || s.on.vi || {};
    return `<li class="scene"><div class="tc"><b>${i + 1}</b>${mmss(start)}</div>
      <div><div class="k">${esc(T(s.k.vi, s.k.en))}</div><p class="txt">${hi}</p>
        ${s.figs.length ? `<div class="figs">${s.figs.map(g => `<div class="fig"><b>${esc(T(g.v.vi, g.v.en))}</b>${g.l ? `<span>${esc(T(g.l.vi, g.l.en))}</span>` : ''}</div>`).join('')}</div>` : ''}
        ${s.src ? `<details class="src"><summary>${T('Nguồn số liệu', 'Data source')}</summary>${esc(s.src)}</details>` : ''}</div>
      <div class="on"><div class="t">${esc(T(...(D.tabs[s.tab] || [s.tab, s.tab])))}${on.sub ? ' › ' + esc(on.sub) : ''}</div>${on.head ? `<div class="h">${esc(on.head)}</div>` : ''}${on.chart ? `<div class="c">▣ ${esc(on.chart)}</div>` : ''}
        <div class="flags">${s.big ? `<i>${T('mở chương', 'chapter opener')}</i>` : ''}${s.pop ? `<i>${T('bật lên', 'pop-up')}</i>` : ''}${s.play ? `<i>${T('chạy lại biểu đồ', 'chart replays')}</i>` : ''}</div></div></li>`; }).join('');
  document.getElementById('film').innerHTML = `<div class="film-h"><h2>${esc(T(f.title.vi || f.name[0], f.title.en || f.name[1]))}</h2><span>${f.scenes.length} ${T('cảnh', 'scenes')} · ≈${mmss(t0)}</span></div>${rows ? `<ol class="sc">${rows}</ol>` : `<p class="empty">${T('Không có cảnh nào khớp.', 'No scene matches.')}</p>`}`;
  document.getElementById('foot').textContent = T('Thời lượng là ước tính theo cách trình chiếu của dashboard (giọng đọc, nhịp nghỉ, biểu đồ chạy lại). Mọi con số trong lời kể đều có thẻ số liệu và lấy từ dữ liệu của dashboard.', 'Running times are estimates using the dashboard player\'s timing (voice, pauses, chart replays). Every number in the narration has a figure card and comes from the dashboard\'s data.');
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-film]'); if (b) { cur = b.dataset.film; try { localStorage.setItem('sb-film', cur); } catch (x) {} render(); return; }
  const l = e.target.closest('[data-lang]'); if (l) { lang = l.dataset.lang; try { localStorage.setItem('sb-lang', lang); } catch (x) {} render(); }
});
document.getElementById('q').addEventListener('input', e => { q = e.target.value; render(); });
render();
</script>
